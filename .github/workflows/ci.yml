name: Rust formatting, tests, Clippy, docs, and MSRV

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Formatting, tests, Clippy, and Rustdoc (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check Rust formatting with rustfmt
        run: cargo fmt --all -- --check

      - name: Run unit, integration, and documentation tests
        run: cargo test --locked

      - name: Lint all targets with Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build Rust API documentation (warnings are errors)
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum Rust version compatibility (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0

      - name: Run the test suite on the minimum supported Rust version
        run: cargo test --locked
